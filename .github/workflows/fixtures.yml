name: Re-record fixtures

# TEMPORARY, on a diagnosis branch only: runs tools/diag_hook.py instead of the recording.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Diagnose the hook-ask scenario
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Diagnose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -I tools/diag_hook.py
